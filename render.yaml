services:
  - type: web
    name: annebella-checker-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: CHECKER_API_URL
        value: https://superassets.in
      - key: CHECKER_API_KEY
        sync: false
      - key: BOT_USERNAME
        sync: false
      - key: PAYMENT_UPI_ID
        sync: false
      - key: USDT_BINANCE_ID
        sync: false
      - key: USDT_BEP20_ADDRESS
        sync: false
      - key: USDT_TRC20_ADDRESS
        sync: false
      - key: USDT_ERC20_ADDRESS
        sync: false
      - key: SUPPORT_URL
        value: https://t.me/annebella
      - key: SIGNUP_CREDITS
        value: 150
      - key: REFERRAL_CREDITS
        value: 20
      - key: CHECK_COST
        value: 5
      - key: MINI_APP_COST
        value: 1000
      - key: PUBLIC_APP_URL
        sync: false
      - key: MINI_APP_URL
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
    healthCheckPath: /healthz
