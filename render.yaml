services:
  - type: web
    name: annebella-checker-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: CHECKER_API_URL
        value: https://superassets.in
      - key: CHECKER_API_KEY
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
    healthCheckPath: /healthz
