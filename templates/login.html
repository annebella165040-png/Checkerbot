<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
  <meta name="theme-color" content="#020910">
  <title>{{ bot_name }} · Admin Login</title>
  <link rel="icon" href="{{ url_for('static', filename='logo.svg') }}" type="image/svg+xml">
  <link rel="manifest" href="{{ url_for('static', filename='admin-manifest.json') }}">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}:root{--c:#00e5c8;--c2:#00b8ff;--dark:#020910;--card:#060e1c;--border:rgba(0,229,200,.18);--red:#ff3b5c;--text:#cce8f0;--dim:#5a8090}html,body{height:100%;overflow:hidden}body{font-family:'Share Tech Mono',monospace;background:var(--dark);color:var(--text);display:flex;align-items:center;justify-content:center;min-height:100vh;position:relative}canvas{position:fixed;inset:0;z-index:0;pointer-events:none}.login-wrap{position:relative;z-index:10;width:min(380px,92vw);animation:pop-in .5s cubic-bezier(.34,1.56,.64,1) both}@keyframes pop-in{from{opacity:0;transform:translateY(28px) scale(.95)}to{opacity:1;transform:none}}.logo-area{display:flex;flex-direction:column;align-items:center;margin-bottom:28px;gap:10px}.logo-hex{width:60px;height:60px;background:radial-gradient(ellipse at 40% 30%,#0d2a52 0%,#061530 50%,#040d1f 100%);border:1.5px solid rgba(80,160,255,.35);border-radius:50%;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;animation:logo-pulse 3s ease-in-out infinite}@keyframes logo-pulse{0%,100%{box-shadow:0 0 14px rgba(50,120,255,.35),0 0 28px rgba(30,80,200,.2)}50%{box-shadow:0 0 24px rgba(80,160,255,.65),0 0 44px rgba(50,120,255,.35)}}.logo-mark{width:30px;height:24px}.logo-title{font-family:Orbitron,sans-serif;font-size:1.05rem;font-weight:900;letter-spacing:3px;text-transform:uppercase;background:linear-gradient(90deg,var(--c),var(--c2),var(--c));background-size:200%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:grad 4s linear infinite}@keyframes grad{to{background-position:200% 0}}.logo-sub{font-size:.65rem;color:rgba(0,229,200,.5);letter-spacing:2px;text-transform:uppercase}.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:28px 24px;position:relative;overflow:hidden}.card:before{content:'';position:absolute;top:0;left:10%;right:10%;height:1px;background:linear-gradient(90deg,transparent,var(--c),transparent)}.card-title{font-size:.72rem;color:rgba(0,229,200,.62);letter-spacing:2px;text-transform:uppercase;margin-bottom:20px;text-align:center}label{display:block;font-size:.65rem;color:rgba(0,229,200,.5);letter-spacing:1px;text-transform:uppercase;margin-bottom:6px}.input-wrap{position:relative;margin-bottom:18px}.input-wrap input{width:100%;background:rgba(0,10,22,.8);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:'Share Tech Mono',monospace;font-size:1.05rem;padding:12px 44px 12px 14px;outline:none;transition:.2s;letter-spacing:3px}.input-wrap input:focus{border-color:var(--c);box-shadow:0 0 0 3px rgba(0,229,200,.08)}.eye-btn{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;padding:4px;color:rgba(0,229,200,.45);transition:.2s}.eye-btn:hover{color:var(--c)}.eye-btn svg{width:18px;height:18px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round;display:block}.flash{display:flex;align-items:center;gap:6px;background:rgba(255,59,92,.1);border:1px solid rgba(255,59,92,.25);border-radius:7px;padding:9px 12px;margin-bottom:14px;font-size:.78rem;color:var(--red)}.btn-login{width:100%;padding:13px;border:none;border-radius:8px;cursor:pointer;font-family:Orbitron,sans-serif;font-size:.82rem;font-weight:700;letter-spacing:2px;text-transform:uppercase;background:linear-gradient(135deg,rgba(0,229,200,.2),rgba(0,184,255,.15));border:1px solid rgba(0,229,200,.35);color:var(--c);transition:.2s;position:relative;overflow:hidden}.btn-login:hover{background:linear-gradient(135deg,rgba(0,229,200,.3),rgba(0,184,255,.25));border-color:var(--c);box-shadow:0 0 20px rgba(0,229,200,.2)}.btn-login:active{transform:scale(.98)}.btn-login:after{content:'';position:absolute;inset:0;background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,.07) 50%,transparent 70%);background-size:200% 100%;background-position:200% 0;transition:.5s}.btn-login:hover:after{background-position:-200% 0}.footer-note{text-align:center;margin-top:16px;font-size:.64rem;color:rgba(90,128,144,.55);letter-spacing:.5px}
  </style>
</head>
<body>
<canvas id="c"></canvas>
<div class="login-wrap">
  <div class="logo-area">
    <div class="logo-hex"><img src="{{ url_for('static', filename='logo.svg') }}" alt="AnneBella logo" style="width:100%;height:100%;display:block"></div>
    <div class="logo-title">AnneBella Checker</div>
    <div class="logo-sub">Admin Access Only</div>
  </div>
  <form class="card" method="post" autocomplete="off">
    <div class="card-title">Secure Login</div>
    {% for message in get_flashed_messages() %}<div class="flash">{{ message }}</div>{% endfor %}
    <label for="pw">Password</label>
    <div class="input-wrap"><input id="pw" type="password" name="password" placeholder="••••••••" required autofocus autocomplete="current-password"><button type="button" class="eye-btn" onclick="togglePw()" title="Show or hide password"><svg id="eye-icon" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
    <button class="btn-login" type="submit">Enter Panel</button>
  </form>
  <div class="footer-note">AnneBella Checker · Admin Control Centre</div>
</div>
<script>
function togglePw(){const inp=document.getElementById('pw'),ico=document.getElementById('eye-icon');if(inp.type==='password'){inp.type='text';ico.innerHTML='<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>'}else{inp.type='password';ico.innerHTML='<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>'}}
(function(){const cv=document.getElementById('c'),ctx=cv.getContext('2d');let W,H,stars=[],shots=[];function resize(){W=cv.width=innerWidth;H=cv.height=innerHeight}addEventListener('resize',resize);resize();for(let i=0;i<200;i++)stars.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.1+.15,a:Math.random(),da:(.003+Math.random()*.008)*(Math.random()<.5?1:-1)});function spawn(){if(Math.random()<.01&&shots.length<4)shots.push({x:Math.random()*W*.8,y:Math.random()*H*.35,dx:3+Math.random()*5,dy:1.5+Math.random()*3,a:1})}function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#020910';ctx.fillRect(0,0,W,H);for(const s of stars){s.a+=s.da;if(s.a<.15||s.a>1)s.da*=-1;ctx.globalAlpha=s.a;ctx.fillStyle='#00e5c8';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill()}spawn();for(const sh of shots){ctx.globalAlpha=sh.a;ctx.strokeStyle='#00e5c8';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(sh.x,sh.y);ctx.lineTo(sh.x-70,sh.y-35);ctx.stroke();sh.x+=sh.dx;sh.y+=sh.dy;sh.a-=.012}shots=shots.filter(s=>s.a>0&&s.x<W+100);ctx.globalAlpha=1;requestAnimationFrame(draw)}draw()})();
</script>
</body>
</html>
